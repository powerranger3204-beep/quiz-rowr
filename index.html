<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seberapa Kamu Kenal Saya? 🤗💗</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#ff9dcc,#c8b6ff,#9eeaff);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:500px;
  background:white;
  padding:28px;
  border-radius:30px;
  box-shadow:0 15px 40px #0003;
  text-align:center;
}

h1{
  color:#ff4f9a;
}

h2{
  color:#333;
}

.emoji{
  font-size:55px;
}

input{
  width:100%;
  padding:15px;
  border:2px solid #ffb0d3;
  border-radius:15px;
  font-size:16px;
  margin:12px 0;
}

button{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:0;
  border-radius:15px;
  background:#ff5ca8;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.answer{
  background:#ead8ff;
  color:#333;
}

.hidden{
  display:none;
}

.score{
  font-size:60px;
  font-weight:bold;
  color:#ff4f9a;
}
</style>
</head>

<body>

<div class="container">

<!-- AWAL -->
<div id="start">

<div class="emoji">🎀✨</div>

<h1>
Seberapa Kamu<br>
Kenal Saya? 😭
</h1>

<p>
Coba buktiin seberapa kenal kamu sama saya! 👀
</p>

<input
id="nama"
placeholder="Nama kamu..."
>

<button onclick="mulai()">
🚀 MULAI GAME
</button>

</div>


<!-- GAME -->
<div id="game" class="hidden">

<p id="nomor"></p>

<h2 id="soal"></h2>

<div id="jawaban"></div>

</div>


<!-- HASIL -->
<div id="hasil" class="hidden">

<div class="emoji">🎉😭</div>

<h1>HASIL KAMU!</h1>

<div class="score" id="score"></div>

<p id="pesan"></p>

<button onclick="location.reload()">
🔄 MAIN LAGI
</button>

</div>

</div>


<script>

const pertanyaan = [

{
soal:"🍜 Makanan yang paling saya suka?",
jawaban:[
"Bakso",
"Mie ayam",
"Nasi goreng",
"Seblak"
],
benar:"Mie ayam"
},

{
soal:"🧋 Minuman yang paling saya suka?",
jawaban:[
"Es teh",
"Kopi",
"Jus",
"Susu"
],
benar:"Es teh"
},

{
soal:"🖤 Warna favorit saya?",
jawaban:[
"Merah",
"Biru",
"Hitam",
"Pink"
],
benar:"Hitam"
},

{
soal:"🎮 Game yang paling saya suka?",
jawaban:[
"Free Fire",
"PUBG",
"Mobile Legends",
"Minecraft"
],
benar:"Mobile Legends"
},

{
soal:"🏊 Olahraga yang saya suka?",
jawaban:[
"Sepak bola",
"Renang",
"Basket",
"Lari"
],
benar:"Renang"
},

{
soal:"🐱 Hewan yang saya suka?",
jawaban:[
"Anjing",
"Kucing",
"Kelinci",
"Hamster"
],
benar:"Kucing"
},

{
soal:"🎤 lagu yang saya sukai apa yaa🤔?",
jawaban:[
"Keizer",
"teh hijau",
"Ariel NOAH",
"Iwan Fals"
],
benar:"teh hijau"
},

{
soal:"👻 Genre film yang saya suka?",
jawaban:[
"Romantis",
"Komedi",
"Horor",
"Action"
],
benar:"Horor"
},

{
soal:"📍 Kota yang berhubungan dengan saya?",
jawaban:[
"Jakarta",
"Bandung",
"Bandar Lampung",
"Surabaya"
],
benar:"Bandar Lampung"
},

{
soal:"💬 Hal yang paling bikin kesel?",
jawaban:[
"Ditelepon terus",
"Di-chat tapi cuma di-read",
"Diajak jalan",
"Dikasih hadiah"
],
benar:"Di-chat tapi cuma di-read"
},

{
soal:"🎉 Apa arti 'noleb'?",
jawaban:[
"No Lebay",
"Nonton Lebih",
"Nongkrong Lebih",
"No Lebih"
],
benar:"No Lebay"
}

];


let posisi=0;
let benar=0;
let nama="";


function mulai(){

nama=document.getElementById("nama").value.trim();

if(nama===""){
alert("Isi nama kamu dulu 😭");
return;
}

document.getElementById("start")
.classList.add("hidden");

document.getElementById("game")
.classList.remove("hidden");

tampilkan();

}


function tampilkan(){

let data=pertanyaan[posisi];

document.getElementById("nomor").innerText=
"Soal "+(posisi+1)+" dari "+pertanyaan.length;

document.getElementById("soal").innerText=
data.soal;

let box=document.getElementById("jawaban");

box.innerHTML="";


data.jawaban.forEach(function(pilihan){

let tombol=document.createElement("button");

tombol.innerText=pilihan;

tombol.className="answer";

tombol.onclick=function(){

jawab(pilihan);

};

box.appendChild(tombol);

});

}


function jawab(pilihan){

if(pilihan===pertanyaan[posisi].benar){

benar++;

}

posisi++;

if(posisi<pertanyaan.length){

tampilkan();

}else{

hasil();

}

}


function hasil(){

document.getElementById("game")
.classList.add("hidden");

document.getElementById("hasil")
.classList.remove("hidden");

let nilai=Math.round(
benar/pertanyaan.length*100
);

document.getElementById("score")
.innerText=nilai+"%";


let pesan="";

if(nilai===100){

pesan=
"GILAAA 😭❤️ KAMU KENAL SAYA BANGET!";

}else if(nilai>=80){

pesan=
"WADUH 😭 KAMU TERNYATA KENAL BANGET!";

}else if(nilai>=60){

pesan=
"LUMAYAN LAH 😭";

}else if(nilai>=40){

pesan=
"KITA HARUS LEBIH SERING NGOBROL 😭";

}else{

pesan=
"SIAPA KAMU 😭😭";

}


document.getElementById("pesan")
.innerText=
nama+" — "+pesan;

}

</script>

</body>
</html>
