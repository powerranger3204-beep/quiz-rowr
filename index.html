<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seberapa Kenal Kamu Sama Aku? 💗</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#ff9dcc,#c8b6ff,#9eeaff);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  overflow-x:hidden;
}

body:before{
  content:"💗  ✨  🎀  💕  ✨  🦋  💗";
  position:fixed;
  top:20px;
  left:0;
  width:100%;
  text-align:center;
  font-size:25px;
  animation:float 3s infinite alternate;
}

@keyframes float{
  from{transform:translateY(0)}
  to{transform:translateY(12px)}
}

.container{
  width:100%;
  max-width:520px;
  background:#ffffffee;
  padding:28px;
  border-radius:30px;
  box-shadow:0 15px 50px #0003;
  text-align:center;
}

h1{
  color:#ff4f9a;
  margin-bottom:10px;
}

h2{
  color:#333;
  line-height:1.4;
}

p{
  color:#666;
}

.logo{
  font-size:65px;
}

input{
  width:100%;
  padding:16px;
  border:2px solid #ffafd4;
  border-radius:16px;
  font-size:16px;
  outline:none;
  margin:15px 0;
}

button{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:0;
  border-radius:16px;
  background:#ff5ca8;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:scale(1.03);
}

.answer{
  background:#f0e2ff;
  color:#333;
}

.answer:hover{
  background:#ffd0e7;
}

.hidden{
  display:none;
}

.progress{
  height:10px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin:15px 0 25px;
}

.bar{
  height:100%;
  background:#ff5ca8;
  width:0%;
  transition:.3s;
}

.score{
  font-size:65px;
  font-weight:bold;
  color:#ff4f9a;
}

.resultbox{
  background:#fff0f7;
  padding:18px;
  border-radius:20px;
  margin:15px 0;
}

.small{
  font-size:13px;
  color:#999;
}

.music{
  position:fixed;
  right:15px;
  bottom:15px;
  width:auto;
  padding:12px 16px;
  border-radius:50px;
  font-size:14px;
}
</style>
</head>

<body>

<button class="music" onclick="toggleMusic()">🎵 Musik</button>

<div class="container">

<!-- HALAMAN AWAL -->
<div id="start">

<div class="logo">🎀💗✨</div>

<h1>Seberapa Kenal<br>Kamu Sama Aku?</h1>

<p>
Bukan sekadar kuis biasa... 👀<br>
<strong>Seberapa kenal kamu sama aku sebenarnya?</strong>
</p>

<input id="nama" placeholder="Tulis nama kamu...">

<button onclick="mulai()">💗 MULAI</button>

<p class="small">
⚠️ Hati-hati... beberapa soal bisa menjebak 😭
</p>

</div>


<!-- GAME -->
<div id="game" class="hidden">

<p id="nomor"></p>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<h2 id="soal"></h2>

<div id="jawaban"></div>

</div>


<!-- HASIL -->
<div id="hasil" class="hidden">

<div class="logo">😭💗🎉</div>

<h1>HASILNYA NIH!</h1>

<p id="namaHasil"></p>

<div class="score" id="score"></div>

<div class="resultbox">
<h2 id="judulHasil"></h2>
<p id="pesan"></p>
</div>

<button onclick="location.reload()">
🔄 COBA LAGI
</button>

</div>

</div>


<script>

/* =========================
   PERTANYAAN
========================= */

const pertanyaan = [

{
soal:"Kalau aku lagi bad mood, kemungkinan terbesar aku bakal... 😭",
jawaban:[
"Ngilang dari dunia",
"Main game",
"Marah-marah ke semua orang",
"Langsung tidur"
],
benar:"Ngilang dari dunia"
},

{
soal:"Kalau dia cuma read chat aku, aku paling mungkin... 💀",
jawaban:[
"Ketawa",
"Chat lagi 20 kali",
"Kesel tapi pura-pura biasa",
"Langsung blokir"
],
benar:"Kesel tapi pura-pura biasa"
},

{
soal:"Kalau disuruh pilih makanan sekarang, kemungkinan aku pilih... 🍜",
jawaban:[
"Pizza",
"Mie ayam",
"Burger",
"Sushi"
],
benar:"Mie ayam"
},

{
soal:"Minuman yang paling gampang bikin aku senang? 🧋",
jawaban:[
"Kopi",
"Es teh",
"Susu",
"Jus alpukat"
],
benar:"Es teh"
},

{
soal:"Kalau harus pakai satu warna terus, aku pilih... 🖤",
jawaban:[
"Pink",
"Biru",
"Putih",
"Hitam"
],
benar:"Hitam"
},

{
soal:"Kalau lagi gabut, kemungkinan aku main... 🎮",
jawaban:[
"PUBG",
"Free Fire",
"Mobile Legends",
"Minecraft"
],
benar:"Mobile Legends"
},

{
soal:"Kalau olahraga, aku lebih milih... 🏊",
jawaban:[
"Lari",
"Basket",
"Renang",
"Sepak bola"
],
benar:"Renang"
},

{
soal:"Hewan yang paling aku suka? 🐱",
jawaban:[
"Anjing",
"Kucing",
"Kelinci",
"Burung"
],
benar:"Kucing"
},

{
soal:"Kalau soal penyanyi, aku lebih pilih... 🎤",
jawaban:[
"Ariel NOAH",
"Rhoma Irama",
"Iwan Fals",
"Keizer"
],
benar:"Rhoma Irama"
},

{
soal:"Kalau nonton film, genre yang paling mungkin aku pilih? 👻",
jawaban:[
"Romantis",
"Komedi",
"Horor",
"Drama"
],
benar:"Horor"
},

{
soal:"Kota yang berhubungan sama aku? 📍",
jawaban:[
"Jakarta",
"Bandung",
"Surabaya",
"Bandar Lampung"
],
benar:"Bandar Lampung"
},

{
soal:"Menurut kamu, aku lebih suka orang yang... 👀",
jawaban:[
"Banyak omong",
"Sok keren",
"Natural dan nggak lebay",
"Suka pamer"
],
benar:"Natural dan nggak lebay"
},

{
soal:"Kalau aku bilang 'terserah', kemungkinan sebenarnya... 😭",
jawaban:[
"Beneran terserah",
"Aku nggak peduli",
"Ada pilihan yang aku mau",
"Aku mau tidur"
],
benar:"Ada pilihan yang aku mau"
},

{
soal:"Kalau ada orang bikin aku kesel, aku biasanya... 💀",
jawaban:[
"Langsung ngamuk",
"Diam tapi inget",
"Ketawa",
"Langsung nangis"
],
benar:"Diam tapi inget"
},

{
soal:"Kalau kamu salah jawab banyak, kemungkinan aku bilang... 😭",
jawaban:[
"Hebat banget!",
"Kamu siapa?",
"Keren!",
"Mantap!"
],
benar:"Kamu siapa?"
}

];

let posisi=0;
let benar=0;
let nama="";


/* =========================
   MUSIK
========================= */

let audio=null;
let musicOn=false;

function mulaiMusik(){

if(audio) return;

audio=new (window.AudioContext || window.webkitAudioContext)();

let gain=audio.createGain();
gain.gain.value=0.04;
gain.connect(audio.destination);

let nada=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];
let i=0;

function mainNada(){

if(!musicOn) return;

let osc=audio.createOscillator();
osc.type="sine";
osc.frequency.value=nada[i%nada.length];

osc.connect(gain);

osc.start();
osc.stop(audio.currentTime+0.35);

i++;

setTimeout(mainNada,380);
}

mainNada();
}

function toggleMusic(){

if(!audio){
musicOn=true;
mulaiMusik();
}else{
musicOn=!musicOn;

if(musicOn){
audio.resume();
}else{
audio.suspend();
}
}

}


/* =========================
   MULAI
========================= */

function mulai(){

nama=document.getElementById("nama").value.trim();

if(nama===""){
alert("Isi nama kamu dulu 😭");
return;
}

musicOn=true;
mulaiMusik();

document.getElementById("start").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");

tampilkan();

}


/* =========================
   TAMPILKAN SOAL
========================= */

function tampilkan(){

let data=pertanyaan[posisi];

document.getElementById("nomor").innerText=
"Soal "+(posisi+1)+" dari "+pertanyaan.length;

document.getElementById("soal").innerText=data.soal;

let persen=(posisi/pertanyaan.length)*100;

document.getElementById("bar").style.width=persen+"%";

let box=document.getElementById("jawaban");

box.innerHTML="";

data.jawaban.forEach(function(pilihan){

let tombol=document.createElement("button");

tombol.innerText=pilihan;
tombol.className="answer";

tombol.onclick=function(){

jawab(pilihan);

};

box.appendChild(tombol);

});

}


/* =========================
   JAWAB
========================= */

function jawab(pilihan){

if(pilihan===pertanyaan[posisi].benar){

benar++;

}

posisi++;

if(posisi<pertanyaan.length){

tampilkan();

}else{

hasil();

}

}


/* =========================
   HASIL
========================= */

function hasil(){

document.getElementById("game").classList.add("hidden");

document.getElementById("hasil").classList.remove("hidden");

let nilai=Math.round(
benar/pertanyaan.length*100
);

document.getElementById("score").innerText=nilai+"%";

document.getElementById("namaHasil").innerText=
nama+" berhasil menyelesaikan kuis! 💗";


let judul="";
let pesan="";


if(nilai===100){

judul="GILA KAMU KENAL BANGET 😭❤️";

pesan=
"Kamu bukan cuma kenal aku... kayaknya kamu hafal isi kepala aku 😭";

}

else if(nilai>=80){

judul="WADUH DEKET NIH 😭💗";

pesan=
"Fix kamu lumayan tau banyak tentang aku.";

}

else if(nilai>=60){

judul="LUMAYAN LAH 😭";

pesan=
"Masih ada beberapa hal yang ternyata kamu belum tau 👀";

}

else if(nilai>=40){

judul="KITA HARUS LEBIH SERING NGOBROL 😭";

pesan=
"Kok bisa banyak yang salah sih 😭";

}

else{

judul="KAMU SIAPA 😭😭";

pesan=
"Kayaknya kita perlu kenalan dari awal lagi deh.";

}


document.getElementById("judulHasil").innerText=judul;

document.getElementById("pesan").innerText=pesan;

}

</script>

</body>
</html>
