<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Rowr 🦁</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #17102b, #3b176d);
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.game {
  width: 100%;
  max-width: 500px;
  background: rgba(0,0,0,.35);
  border-radius: 25px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,.4);
}

h1 {
  font-size: 42px;
  margin: 5px;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  margin: 20px 0 10px;
  font-size: 17px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: #ffd43b;
}

.answer {
  background: #ffffff;
  color: #222;
}

.answer:hover {
  transform: scale(1.02);
}

.stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
  font-weight: bold;
}

#gameScreen,
#resultScreen {
  display: none;
}

#timer {
  font-size: 28px;
  margin: 10px;
}

#question {
  font-size: 22px;
  margin: 25px 0;
}

#score {
  font-size: 20px;
}
</style>
</head>

<body>

<div class="game">

  <!-- START -->
  <div id="startScreen">

    <h1>🦁</h1>
    <h1>QUIZ ROWR</h1>

    <p>Siap menguji otakmu? 🔥</p>

    <input
      id="playerName"
      placeholder="Masukkan nama kamu..."
      maxlength="20"
    >

    <button class="start" onclick="startGame()">
      🚀 MULAI GAME
    </button>

  </div>


  <!-- GAME -->
  <div id="gameScreen">

    <div class="stats">
      <span>❤️ <span id="lives">3</span></span>
      <span>🏆 <span id="score">0</span></span>
    </div>

    <div id="timer">⏱️ 10</div>

    <div id="question"></div>

    <div id="answers"></div>

  </div>


  <!-- RESULT -->
  <div id="resultScreen">

    <h1>🎉</h1>

    <h2>GAME SELESAI!</h2>

    <p id="resultText"></p>

    <button class="start" onclick="location.reload()">
      🔄 MAIN LAGI
    </button>

  </div>

</div>


<script>

const questions = [

  {
    q: "🌍 Planet terbesar di tata surya?",
    a: ["Bumi", "Mars", "Jupiter", "Venus"],
    correct: 2
  },

  {
    q: "🦁 Hewan yang dikenal sebagai raja hutan?",
    a: ["Harimau", "Singa", "Serigala", "Beruang"],
    correct: 1
  },

  {
    q: "🇮🇩 Ibukota Indonesia?",
    a: ["Bandung", "Surabaya", "Jakarta", "Medan"],
    correct: 2
  },

  {
    q: "💻 HTML digunakan untuk membuat?",
    a: ["Struktur website", "Musik", "Game console", "Kamera"],
    correct: 0
  },

  {
    q: "🔥 Air mendidih pada suhu?",
    a: ["50°C", "75°C", "100°C", "200°C"],
    correct: 2
  }

];

let player = "";
let current = 0;
let score = 0;
let lives = 3;
let time = 10;
let timer;


function startGame() {

  player = document.getElementById("playerName").value.trim();

  if (!player) {
    alert("Masukkan nama dulu 😭");
    return;
  }

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";

  showQuestion();
}


function showQuestion() {

  clearInterval(timer);

  time = 10;

  document.getElementById("timer").innerText = "⏱️ " + time;

  const q = questions[current];

  document.getElementById("question").innerText = q.q;

  const answers = document.getElementById("answers");

  answers.innerHTML = "";

  q.a.forEach((answer, index) => {

    const button = document.createElement("button");

    button.className = "answer";

    button.innerText = answer;

    button.onclick = () => checkAnswer(index);

    answers.appendChild(button);

  });

  timer = setInterval(() => {

    time--;

    document.getElementById("timer").innerText =
      "⏱️ " + time;

    if (time <= 0) {

      clearInterval(timer);

      lives--;

      document.getElementById("lives").innerText = lives;

      nextQuestion();

    }

  }, 1000);

}


function checkAnswer(index) {

  clearInterval(timer);

  if (index === questions[current].correct) {

    score += 100;

    document.getElementById("score").innerText = score;

  } else {

    lives--;

    document.getElementById("lives").innerText = lives;

  }

  nextQuestion();

}


function nextQuestion() {

  current++;

  if (lives <= 0 || current >= questions.length) {

    endGame();

  } else {

    setTimeout(showQuestion, 400);

  }

}


function endGame() {

  clearInterval(timer);

  document.getElementById("gameScreen").style.display = "none";

  document.getElementById("resultScreen").style.display = "block";

  document.getElementById("resultText").innerHTML =
    "Pemain: <b>" + player + "</b><br><br>" +
    "🏆 Skor kamu: <b>" + score + "</b>";

}

</script>

</body>
</html>
