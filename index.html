<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seberapa Kamu Kenal Saya? 💗</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #ffb6d9, #c8b6ff, #a8e6ff);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Hiasan lucu */
body::before,
body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  z-index: 0;
}

body::before {
  width: 180px;
  height: 180px;
  background: #ff8fc7;
  top: -60px;
  left: -50px;
}

body::after {
  width: 220px;
  height: 220px;
  background: #a98cff;
  bottom: -80px;
  right: -60px;
}

.container {
  position: relative;
  z-index: 2;
  width: 92%;
  max-width: 500px;
  background: rgba(255,255,255,0.93);
  padding: 28px;
  border-radius: 30px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  text-align: center;
}

h1 {
  color: #ff4f9a;
  margin-bottom: 10px;
}

h2 {
  color: #333;
}

p {
  color: #555;
}

input {
  width: 100%;
  padding: 14px;
  border: 2px solid #ffb0d3;
  border-radius: 15px;
  outline: none;
  font-size: 16px;
  margin: 15px 0;
}

button {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border: none;
  border-radius: 15px;
  background: #ff69a9;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.03);
  background: #ff4f98;
}

.answer {
  background: #f5e8ff;
  color: #444;
}

.answer:hover {
  background: #e8d2ff;
}

.hidden {
  display: none;
}

#nomor {
  color: #ff4f9a;
  font-weight: bold;
}

.score {
  font-size: 55px;
  font-weight: bold;
  color: #ff4f9a;
}

.emoji {
  font-size: 55px;
}

.small {
  font-size: 13px;
  color: #777;
}
</style>
</head>

<body>

<div class="container">

  <!-- HALAMAN AWAL -->
  <div id="start">
    <div class="emoji">🎀✨</div>

    <h1>Seberapa Kamu<br>Kenal Saya? 😭</h1>

    <p>
      Coba buktikan seberapa kenal kamu sama saya! 👀
    </p>

    <p class="small">
      ⚠️ Hati-hati... salah jawab bisa bikin malu sendiri 😭
    </p>

    <input
      type="text"
      id="nama"
      placeholder="Masukkan nama kamu..."
    >

    <button onclick="mulaiGame()">
      MULAI GAME 🚀
    </button>
  </div>


  <!-- HALAMAN SOAL -->
  <div id="game" class="hidden">

    <p id="nomor"></p>

    <h2 id="pertanyaan"></h2>

    <div id="jawaban"></div>

  </div>


  <!-- HALAMAN HASIL -->
  <div id="hasil" class="hidden">

    <div class="emoji">🎉😭</div>

    <h1>Hasil Kamu!</h1>

    <p id="pesan"></p>

    <div class="score" id="nilai"></div>

    <p id="benar"></p>

    <button onclick="location.reload()">
      MAIN LAGI 🔄
    </button>

  </div>

</div>


<script>

const soal = [

  {
    tanya: "🍜 Makanan yang paling saya suka?",
    pilihan: [
      "Bakso",
      "Mie ayam",
      "Nasi goreng",
      "Seblak"
    ],
    benar: "Mie ayam"
  },

  {
    tanya: "🧋 Minuman yang paling saya suka?",
    pilihan: [
      "Es teh",
      "Kopi",
      "Jus jeruk",
      "Susu"
    ],
    benar: "Es teh"
  },

  {
    tanya: "🖤 Warna favorit saya?",
    pilihan: [
      "Merah",
      "Biru",
      "Hitam",
      "Pink"
    ],
    benar: "Hitam"
  },

  {
    tanya: "🎮 Game yang paling saya suka?",
    pilihan: [
      "Free Fire",
      "PUBG",
      "Mobile Legends",
      "Minecraft"
    ],
    benar: "Mobile Legends"
  },

  {
    tanya: "🏊 Olahraga yang saya suka?",
    pilihan: [
      "Sepak bola",
      "Renang",
      "Basket",
      "Lari"
    ],
    benar: "Renang"
  },

  {
    tanya: "🐱 Hewan yang saya suka?",
    pilihan: [
      "Anjing",
      "Kucing",
      "Kelinci",
      "Hamster"
    ],
    benar: "Kucing"
  },

  {
    tanya: "🎤 Penyanyi yang saya pilih?",
    pilihan: [
      "Keizer",
      "Rhoma Irama",
      "Ariel NOAH",
      "Iwan Fals"
    ],
    benar: "Rhoma Irama"
  },

  {
    tanya: "👻 Genre film yang saya suka?",
    pilihan: [
      "Romantis",
      "Komedi",
      "Horor",
      "Action"
    ],
    benar: "Horor"
  },

  {
    tanya: "📍 Kota yang berhubungan dengan saya?",
    pilihan: [
      "Jakarta",
      "Bandung",
      "Bandar Lampung",
      "Surabaya"
    ],
    benar: "Bandar Lampung"
  },

  {
    tanya: "💬 Hal yang paling bikin kesel?",
    pilihan: [
      "Ditelepon terus",
      "Di-chat tapi cuma di-read",
      "Diajak jalan",
      "Dikasih hadiah"
    ],
    benar: "Di-chat tapi cuma di-read"
  },

  {
    tanya: "🎉 Kalau ada yang bilang 'noleb', maksudnya?",
    pilihan: [
      "No Lebay",
      "Nonton Lebih",
      "Nongkrong Lebih",
      "No Lebih"
    ],
    benar: "No Lebay"
  }

];

let nomor = 0;
let skor = 0;
let nama = "";


function mulaiGame() {

  nama = document.getElementById("nama").value.trim();

  if (nama === "") {
    alert("Isi nama kamu dulu dong 😭");
    return;
  }

  document.getElementById("start").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  tampilkanSoal();
}


function tampilkanSoal() {

  const data = soal[nomor];

  document.getElementById("nomor").innerText =
    "Soal " + (nomor + 1) + " dari " + soal.length;

  document.getElementById("pertanyaan").innerText =
    data.tanya;

  const tempatJawaban =
    document.getElementById("jawaban");

  tempatJawaban.innerHTML = "";

  data.pilihan.forEach(function(pilihan) {

    const tombol = document.createElement("button");

    tombol.innerText = pilihan;
    tombol.className = "answer";

    tombol.onclick = function() {
      jawab(pilihan);
    };

    tempatJawaban.appendChild(tombol);

  });
}


function jawab(pilihan) {

  if (pilihan === soal[nomor].benar) {
    skor++;
  }

  nomor++;

  if (nomor < soal.length) {
    tampilkanSoal();
  } else {
    tampilkanHasil();
  }
}


function tampilkanHasil() {

  document.getElementById("game").classList.add("hidden");
  document.getElementById("hasil").classList.remove("hidden");

  const nilai = Math.round((skor / soal.length) * 100);

  document.getElementById("nilai").innerText =
    nilai + "%";

  document.getElementById("benar").innerText =
    nama + ", kamu benar " + skor + " dari " + soal.length + " soal!";

  let pesan = "";

  if (nilai === 100) {
    pesan = "GILA 😭❤️ Kamu kenal saya banget!";
  }
  else if (nilai >= 80) {
    pesan = "WADUH 😭 Kamu ternyata lumayan kenal saya!";
  }
  else if (nilai >= 60) {
    pesan = "Hmmmm... masih lumayan lah 😭";
  }
  else if (nilai >= 40) {
    pesan = "Kita kayaknya harus lebih sering ngobrol 😭";
  }
  else {
    pesan = "SIAPA KAMU 😭😭 Kok nggak kenal saya sama sekali?";
  }

  document.getElementById("pesan").innerText = pesan;
}

</script>

</body>
</html>
